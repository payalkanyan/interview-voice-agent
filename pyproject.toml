[project]
name = "interview-voice-agent"
version = "0.1.0"
description = "Voice mock interview coach built with Pipecat"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[cartesia,deepgram,google,runner,silero,webrtc]==1.14.0",
    "loguru>=0.7.3",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
